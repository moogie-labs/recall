name: Release macOS installer

# Version tags publish stable releases (or GitHub prereleases for SemVer
# prerelease tags). Pushes to main publish the rolling `edge` channel build,
# signed and notarized by the same jobs, using the `release-channel` environment.
"on":
  push:
    tags: ['v*']
    branches: [main]

permissions:
  contents: read

# One run per ref at a time. A newer push to main replaces any queued channel
# run but never cancels one in progress (which may be mid-publish).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Credential boundary: the jobs that receive Apple secrets (runtime, sign) set up
# no Go/Node toolchain and run only Apple tools plus this repository's Python on
# artifacts. All third-party build code (Go modules, npm packages, Wails) runs in
# the secret-free build job on a separate, disposable runner, so it can never
# reach the signing keychain or notarization profile.
jobs:
  prepare:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Choose version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(python3 scripts/release-macos.py channel "$RUN_NUMBER")"
          fi
          RELEASE_TAG="$tag" python3 -c 'import runpy,os,sys; sys.path.insert(0,"scripts"); runpy.run_path("scripts/release-macos.py")["version"](os.environ["RELEASE_TAG"])'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release version: $tag"

  runtime:
    needs: prepare
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ github.ref_type == 'tag' && 'release' || 'release-channel' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 -c 'import runpy,os,sys; sys.path.insert(0,"scripts"); runpy.run_path("scripts/release-macos.py")["version"](os.environ["RELEASE_TAG"])'
      - name: Sign and notarize pinned runtime
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APPLICATION_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python3 scripts/release-macos.py runtime "$RELEASE_TAG" build/release-runtime
      - name: Always remove signing material
        if: always()
        shell: bash
        run: |
          keychain="$GITHUB_WORKSPACE/build/release-private/release.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          python3 -c 'from pathlib import Path; import shutil; p=Path("build/release-private"); shutil.rmtree(p) if p.exists() else None'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-runtime
          path: build/release-runtime/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [prepare, runtime]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 -c 'import runpy,os,sys; sys.path.insert(0,"scripts"); runpy.run_path("scripts/release-macos.py")["version"](os.environ["RELEASE_TAG"])'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-runtime
          path: build/release-runtime
      - name: Credential-free verification
        run: |
          go test ./...
          sh scripts/build-desktop.sh
          (cd desktop && go test ./...)
          python3 -m unittest discover -s scripts -p 'test_release_macos.py'
          python3 scripts/verify-desktop.py build/Recall.app
      - name: Build unsigned release payload
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/release-macos.py build "$RELEASE_TAG" build/release-runtime build/release-payload/payload.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-payload
          path: build/release-payload/payload.tar
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [prepare, runtime, build]
    runs-on: macos-15
    timeout-minutes: 90
    environment: ${{ github.ref_type == 'tag' && 'release' || 'release-channel' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 -c 'import runpy,os,sys; sys.path.insert(0,"scripts"); runpy.run_path("scripts/release-macos.py")["version"](os.environ["RELEASE_TAG"])'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-runtime
          path: build/release-runtime
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-payload
          path: build/release-payload
      - name: Sign, notarize and verify installer
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APPLICATION_P12_BASE64: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12_BASE64 }}
          INSTALLER_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_PASSWORD }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python3 scripts/release-macos.py sign "$RELEASE_TAG" build/release-payload/payload.tar build/release-runtime build/release
      - name: Always remove signing material
        if: always()
        shell: bash
        run: |
          keychain="$GITHUB_WORKSPACE/build/release-private/release.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          python3 -c 'from pathlib import Path; import shutil; p=Path("build/release-private"); shutil.rmtree(p) if p.exists() else None'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarized-installer
          path: build/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notarized-installer
          path: release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          cd release
          shasum -a 256 -c "Recall-${version}-darwin-arm64.pkg.sha256"
          extra=()
          if [[ "$version" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$tag" --verify-tag --draft --title "Recall $version" --generate-notes "${extra[@]}"
          gh release upload "$tag" "Recall-${version}-darwin-arm64.pkg" "Recall-${version}-darwin-arm64.pkg.sha256"
          gh release edit "$tag" --draft=false

  publish-channel:
    needs: [prepare, sign]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notarized-installer
          path: release
      - name: Replace the rolling edge release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          channel=edge
          version="${RELEASE_TAG#v}"
          [[ "$version" == *-"$channel".* ]] || { echo "not a $channel version: $version" >&2; exit 1; }
          cd release
          shasum -a 256 -c "Recall-${version}-darwin-arm64.pkg.sha256"
          notes="Rolling $channel build of $GITHUB_SHA from main, signed and notarized. Not a stable release: every push to main replaces it."
          if gh release view "$channel" >/dev/null 2>&1; then
            gh release delete "$channel" --cleanup-tag --yes
          fi
          # A leftover tag would make `create` ignore --target and keep the old commit.
          if gh api "repos/$GH_REPO/git/ref/tags/$channel" >/dev/null 2>&1; then
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$channel"
          fi
          gh release create "$channel" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "Recall $version" --notes "$notes"
          gh release upload "$channel" "Recall-${version}-darwin-arm64.pkg" "Recall-${version}-darwin-arm64.pkg.sha256"
          gh release edit "$channel" --draft=false
